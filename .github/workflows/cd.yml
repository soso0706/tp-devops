# Workflow CD : construction et publication des images Docker
name: CD devops 2026

on:
  # Se déclenche quand le workflow CI (par son nom) est terminé
  workflow_run:
    workflows: ["CI devops 2026"]
    types: [completed]
    # Uniquement quand la CI a tourné sur main
    branches: [ main ]

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-24.04
    # Ne s'exécute que si la CI s'est terminée avec succès
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Récupère le code exact du commit testé par la CI
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Connexion à Docker Hub avec les secrets GitHub
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # Version de l'image : 1.0.N, où N est le numéro d'exécution de la CI (il augmente à chaque publication)
      - name: Compute version
        id: vars
        run: echo "version=1.0.${{ github.event.workflow_run.run_number }}" >> $GITHUB_OUTPUT

      # Image du backend (Dockerfile dans simple-api)
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:${{ steps.vars.outputs.version }}
          push: true

      # Image de la base de données (Dockerfile dans database)
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:${{ steps.vars.outputs.version }}
          push: true

      # Image du serveur HTTP (Dockerfile dans http-server)
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}sosomartinez/tp-devops-httpd:latest
            ${{ secrets.DOCKERHUB_USERNAME }}sosomartinez/tp-devops-httpd:${{ steps.vars.outputs.version }}
          push: true

      # Image du front (Dockerfile dans devops-front)
      - name: Build image and push front
        uses: docker/build-push-action@v6
        with:
          context: ./devops-front
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}sosomartinez/tp-devops-front:latest
            ${{ secrets.DOCKERHUB_USERNAME }}sosomartinez/tp-devops-front:${{ steps.vars.outputs.version }}
          push: true

  deploy:
    runs-on: ubuntu-24.04
    needs: build-and-push-docker-image
    steps:
      # Récupère le code du commit testé (il contient le dossier ansible)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install ansible

      # Prépare la connexion SSH vers le serveur avec la clé stockée dans les secrets
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan solene.martinez.takima.school >> ~/.ssh/known_hosts

      # Lance le playbook : il télécharge les nouvelles images et relance les conteneurs
      - name: Deploy with Ansible
        working-directory: ansible
        run: ansible-playbook -i inventories/setup.yml playbook.yml -e ansible_ssh_private_key_file=$HOME/.ssh/id_rsa