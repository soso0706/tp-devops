# Nom du workflow, affiché dans l'onglet Actions de GitHub
name: CI devops 2026

# Déclencheurs : quand le pipeline se lance
on:
  # À chaque push sur les branches main et develop
  push:
    branches: [ main, develop ]
  # À chaque ouverture ou mise à jour d'une pull request
  pull_request:

jobs:
  # Job qui build et teste le backend (simple-api)
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # Récupère le code du dépôt sur le runner
      - uses: actions/checkout@v4

      # Installe Java 21 (distribution Temurin)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Compile le projet et lance les tests (unitaires + intégration avec Testcontainers)
      - name: Build and test with Maven
        run: mvn clean verify --file simple-api/pom.xml

      # Analyse de la qualité du code avec SonarCloud
      # -B : mode non interactif (adapté aux robots)
      # sonar:sonar : envoie le rapport d'analyse à SonarCloud
      # Les clés identifient ton projet et ton organisation sur SonarCloud
      # Le token est lu depuis les secrets GitHub (jamais écrit en clair)
      - name: Analyze with SonarCloud
        run: mvn -B verify sonar:sonar -Dsonar.projectKey=<ta-project-key> -Dsonar.organization=<ta-organization-key> -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONAR_TOKEN }} --file ./simple-api/pom.xml

  # Job qui construit et publie les images Docker sur Docker Hub
  build-and-push-docker-image:
    # Ne démarre que si test-backend a réussi (code qui compile et tests verts)
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Connexion à Docker Hub avec les secrets GitHub
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # Image du backend (Dockerfile dans simple-api)
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          # Dossier qui contient le Dockerfile
          context: ./simple-api
          # Le nom de l'image doit être en minuscules
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
          # Build sur toutes les branches, push uniquement sur main
          push: ${{ github.ref == 'refs/heads/main' }}

      # Image de la base de données (Dockerfile dans database)
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # Image du serveur HTTP (Dockerfile dans http-server)
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
          push: ${{ github.ref == 'refs/heads/main' }}